<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="30%" cy="25%" r="80%">
      <stop offset="0%" stop-color="#140828"/>
      <stop offset="100%" stop-color="#07080f"/>
    </radialGradient>
    <filter id="glow-green" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-red" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-gold" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>

  <!-- Grid lines (subtle) -->
  <line x1="56" y1="152" x2="456" y2="152" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1.5"/>
  <line x1="56" y1="256" x2="456" y2="256" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1.5"/>
  <line x1="56" y1="360" x2="456" y2="360" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1.5"/>

  <!-- ── CANDLE 1: BEARISH (RED) — center x=116 ── -->
  <!-- Wick -->
  <line x1="116" y1="112" x2="116" y2="396" stroke="#ef4444" stroke-width="8" stroke-linecap="round" filter="url(#glow-red)"/>
  <!-- Body (open top, close bottom → red) -->
  <rect x="80" y="172" width="72" height="156" rx="10" fill="#ef4444" filter="url(#glow-red)"/>
  <!-- Body shine -->
  <rect x="84" y="176" width="28" height="148" rx="7" fill="#ff7070" opacity="0.25"/>

  <!-- ── CANDLE 2: BULLISH (GREEN) — center x=256, tallest ── -->
  <!-- Wick -->
  <line x1="256" y1="84" x2="256" y2="428" stroke="#22c55e" stroke-width="8" stroke-linecap="round" filter="url(#glow-green)"/>
  <!-- Body (close top, open bottom → green) -->
  <rect x="220" y="108" width="72" height="252" rx="10" fill="#22c55e" filter="url(#glow-green)"/>
  <!-- Body shine -->
  <rect x="224" y="112" width="28" height="244" rx="7" fill="#6effa0" opacity="0.2"/>

  <!-- ── CANDLE 3: BULLISH (GOLD) — center x=396 ── -->
  <!-- Wick -->
  <line x1="396" y1="100" x2="396" y2="412" stroke="#d4a843" stroke-width="8" stroke-linecap="round" filter="url(#glow-gold)"/>
  <!-- Body (close top, open bottom → gold) -->
  <rect x="360" y="132" width="72" height="204" rx="10" fill="#d4a843" filter="url(#glow-gold)"/>
  <!-- Body shine -->
  <rect x="364" y="136" width="28" height="196" rx="7" fill="#ffe080" opacity="0.25"/>
</svg>
